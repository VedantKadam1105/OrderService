server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.neosoft.order_service: DEBUG
    org.hibernate.SQL: DEBUG


aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket-name: ${AWS_BUCKET:order-service-invoices-poc}
  sns:
    topic-arn: ${AWS_SNS_TOPIC:arn:aws:sns:us-east-1:253490772981:order-created-topic}